# Anonymous PB-TriHyper ICDM reproduction config.
# Dataset partition for this setting must be prepared before running; see README.
method: pb_trihyper

dataset:
  name: cifar100

model:
  name: avgcnn
  use_torchvision_pretrained_weights: true
  external_model_weights_path: null

optimizer:
  name: sgd
  lr: 0.01
  dampening: 0
  weight_decay: 0
  momentum: 0
  alpha: 0.99
  nesterov: false
  betas: [0.9, 0.999]
  amsgrad: false

lr_scheduler:
  name: null

mode: serial
parallel:
  ray_cluster_addr: null
  num_cpus: null
  num_gpus: null
  num_workers: 2

common:
  seed: 42
  join_ratio: 0.25
  global_epoch: 1000
  local_epoch: 5
  batch_size: 32
  reset_optimizer_on_global_epoch: true
  straggler_ratio: 0
  straggler_min_local_epoch: 0
  buffers: drop
  client_side_evaluation: true
  test:
    client:
      interval: 1000
      finetune_epoch: 0
      train: false
      val: false
      test: true
    server:
      interval: -1
      train: false
      val: false
      test: false
      model_in_train_mode: false
  verbose_gap: 10
  monitor: null
  use_cuda: true
  save_log: true
  save_model: false
  save_learning_curve_plot: true
  save_metrics: true
  delete_useless_run: true

pb_trihyper:
  routing_granularity: block
  # effective_block_size_q overrides the legacy chunk_size // 2 rule.
  effective_block_size_q: 512
  chunk_size: 1024
  ablation_mode: full
